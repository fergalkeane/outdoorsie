<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outdoorsie — device preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#DDE3DF;--bar:#FFFFFF;--ink:#1E2A30;--muted:#5F6D74;--line:#CCD5D0;--seg:#EEF2EF;--on:#2E3A44;--on-ink:#FFFFFF;--blue:#1A93D0;--bezel:#1B2226;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1214;--bar:#151D20;--ink:#E8EEEB;--muted:#94A39E;--line:#2A3639;--seg:#1E292C;--on:#3AAAE3;--on-ink:#0C1214;--bezel:#000;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1214;--bar:#151D20;--ink:#E8EEEB;--muted:#94A39E;--line:#2A3639;--seg:#1E292C;--on:#3AAAE3;--on-ink:#0C1214;--bezel:#000;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Figtree",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--line)}
.brand{font:600 17px/1 "Outfit",system-ui,sans-serif;letter-spacing:-.01em;margin-right:4px}
.brand span{color:var(--muted);font-weight:500}
.seg{display:inline-flex;background:var(--seg);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--ink);font:500 14px/1 inherit;font-family:inherit;height:32px;padding:0 12px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.seg button:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--blue);outline-offset:2px}
select{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bar);color:var(--ink);padding:0 10px;font:inherit}
.tog{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;border-radius:6px}
.tog input{accent-color:var(--blue)}
.open-site{color:var(--blue);font-weight:600;text-decoration:none}
.open-site:hover{text-decoration:underline}
[hidden]{display:none!important}
.dim{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.device{transform-origin:top center;flex:none;background:var(--bezel);transition:width .25s ease,height .25s ease}
.device iframe{display:block;border:0;background:#fff;width:100%;height:100%}
.device.desktop{border-radius:10px;padding:28px 0 0;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.device.desktop::before{content:"";position:absolute;top:10px;left:14px;width:52px;height:9px;background:radial-gradient(circle at 4.5px 4.5px,#ff5f57 4px,transparent 4.5px),radial-gradient(circle at 22.5px 4.5px,#febc2e 4px,transparent 4.5px),radial-gradient(circle at 40.5px 4.5px,#28c840 4px,transparent 4.5px)}
.device.desktop iframe{border-radius:0 0 10px 10px}
.device.tablet{border-radius:36px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.22)}
.device.tablet iframe{border-radius:16px}
.device.mobile{border-radius:52px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.22)}
.device.mobile iframe{border-radius:40px}
@media (max-width:640px){.dim{display:none}.brand span{display:none}.stage{padding:12px}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">Outdoorsie <span>· booking preview</span></div>
  <div class="seg" role="group" aria-label="Device">
    <button type="button" data-dev="desktop" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>Desktop</button>
    <button type="button" data-dev="tablet" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2.5" width="14" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Tablet</button>
    <button type="button" data-dev="mobile" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Mobile</button>
  </div>
  <label class="sr" for="page" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Page</label>
  <select id="page" aria-label="Jump to page">
    <option value="home">Home</option>
    <option value="search">Search results</option>
    <option value="locations">Locations map</option>
    <option value="experience">Experience detail</option>
    <option value="checkout">Checkout</option>
    <option value="confirmed">Booking confirmed</option>
    <option value="saved">Saved</option>
  </select>
  <label class="tog" id="slots-wrap"><input type="checkbox" id="slots" checked>Show photo file names</label>
  <a class="open-site" id="open-site" href="app.html" target="_blank" rel="noopener" hidden>Open full site</a>
  <div class="dim" id="dim"></div>
</div>
<div class="stage" id="stage">
  <div class="device desktop" id="device"><iframe id="site" allow="fullscreen" allowfullscreen title="Outdoorsie site preview" src="app.html"></iframe></div>
</div>
<script>
(function(){
var DEV={desktop:{w:1440,h:900,label:"Desktop · 1440 px"},tablet:{w:834,h:1112,label:"Tablet · 834 px"},mobile:{w:390,h:844,label:"Mobile · 390 px"}};
var dev="desktop",stage=document.getElementById("stage"),box=document.getElementById("device"),frame=document.getElementById("site");
var hashMode=!frame.hasAttribute("srcdoc");
var h=(location.hash||"").slice(1);if(DEV[h])dev=h;else if(window.innerWidth<700)dev="mobile";
if(hashMode){document.getElementById("slots-wrap").hidden=true;document.getElementById("open-site").hidden=false}
function fit(){
  var d=DEV[dev],cs=getComputedStyle(stage),aw=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  var pad=dev==="desktop"?{x:0,y:28}:dev==="tablet"?{x:44,y:44}:{x:28,y:28};
  var fullW=d.w+pad.x,s,fullH;
  if(dev==="desktop"){s=Math.min(1,aw/fullW);fullH=ah/s;}
  else{fullH=d.h+pad.y;s=Math.min(1,aw/fullW,ah/fullH);}
  box.className="device "+dev;
  box.style.width=fullW+"px";box.style.height=fullH+"px";
  box.style.transform="scale("+s+")";
  box.style.marginBottom=(-(fullH*(1-s)))+"px";
  document.getElementById("dim").textContent=d.label+(s<1?" · "+Math.round(s*100)+"%":"");
  document.querySelectorAll("[data-dev]").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.dev===dev)});
}
document.querySelectorAll("[data-dev]").forEach(function(b){b.addEventListener("click",function(){dev=b.dataset.dev;try{history.replaceState(null,"","#"+dev)}catch(e){}fit()})});
window.addEventListener("hashchange",function(){var x=location.hash.slice(1);if(DEV[x]){dev=x;fit()}});
window.addEventListener("resize",fit);
function send(msg){try{frame.contentWindow.postMessage(msg,"*")}catch(e){}}
var PAGEHASH={home:"home",search:"search",locations:"locations",experience:"experience-yosemite-hike",checkout:"checkout",confirmed:"confirmed",saved:"saved"};
document.getElementById("page").addEventListener("change",function(e){
  if(!hashMode){send({od:"go",view:e.target.value});return}
  try{frame.contentWindow.location.hash=PAGEHASH[e.target.value]}catch(err){frame.src="app.html#"+PAGEHASH[e.target.value]}
});
if(hashMode)setInterval(function(){try{var x=frame.contentWindow.location.hash.slice(1)||"home";var v=x.indexOf("experience-")===0?"experience":x;var sel=document.getElementById("page");if(sel.value!==v&&sel.querySelector('option[value="'+v+'"]'))sel.value=v;document.getElementById("open-site").href="app.html"+(x==="home"?"":"#"+x)}catch(err){}},500);
document.getElementById("slots").addEventListener("change",function(e){send({od:"slots",on:e.target.checked})});
window.addEventListener("message",function(m){var d=m.data||{};if(d.od==="view"){var sel=document.getElementById("page");if(sel.querySelector('option[value="'+d.view+'"]'))sel.value=d.view}});
function syncTheme(){send({od:"theme",theme:document.documentElement.getAttribute("data-theme")||""})}
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
frame.addEventListener("load",function(){syncTheme();send({od:"slots",on:document.getElementById("slots").checked})});
fit();
})();
</script>
</body>
</html>
